<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Glad You Were Born Today</title>
<meta name="description" content="You're invited. Break the seal to enter the world of Starry &amp; the Crashers — the crew that crashes boring birthday parties and makes them unforgettable." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky:#5BB8F0;
    --royal:#2E4396;
    --royal-deep:#1D2B50;
    --gold:#e6c46a;
    --gold-deep:#b8862e;
    --ink:#1D2B50;
    --cream:#FFF9EE;
    --pink:#E84A9B;
    --font-display:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    overflow:hidden;
    background:var(--sky);
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---- video stage: placeholder blur-up, then the envelope clip itself ---- */
  .stage{position:fixed;inset:0;z-index:1;background:var(--sky);}
  .stage__ph,#scene-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .stage__ph{filter:blur(14px);transform:scale(1.06);transition:opacity .5s ease;}
  .stage__ph.gone{opacity:0;}
  .tap-layer{position:absolute;inset:0;z-index:3;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .tap-layer[disabled]{cursor:default;}

  /* gentle hover-bob while the envelope waits to be opened; the slight scale
     overscan keeps cover-cropped edges hidden through the whole cycle */
  @keyframes envelope-idle{
    0%,100%{transform:translateY(0) scale(1.025);}
    50%{transform:translateY(-0.9%) scale(1.025);}
  }
  .stage.idle #scene-video,.stage.idle .stage__ph{animation:envelope-idle 5.2s ease-in-out infinite;}

  #confetti{position:fixed;inset:0;z-index:5;pointer-events:none;}

  .ui{position:fixed;inset:0;z-index:3;pointer-events:none;}

  /* visible tap-to-open call to action pinned under the envelope */
  .open-cta{
    position:fixed;left:50%;bottom:max(clamp(44px,10vh,92px), env(safe-area-inset-bottom));
    transform:translateX(-50%);
    animation:cta-pulse 2.6s ease-in-out infinite;
  }
  @keyframes cta-pulse{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.05);}
  }
  .open-btn{
    pointer-events:auto;cursor:pointer;
    background:linear-gradient(180deg,#FFFDF4,#F6E8C8);
    color:#8E2233;border:1.5px solid rgba(184,134,46,.65);
    font-family:var(--font-display);font-size:12.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;
    padding:14px 30px;border-radius:999px;
    box-shadow:0 10px 28px rgba(80,54,10,.28), inset 0 1px 0 rgba(255,255,255,.85);
    transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
  }
  .open-btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 14px 34px rgba(80,54,10,.34);}
  .open-btn:active{transform:translateY(0);}
  .open-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

  /* ---- the two choices: rendered ON the letter, tracked in JS ---- */
  .sheet-actions{
    position:fixed;left:50%;top:60%;z-index:6;
    display:flex;flex-direction:column;align-items:stretch;gap:11px;
    width:min(72vw,306px);
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:center center;
    opacity:0;pointer-events:none;
    transition:opacity .45s ease, visibility .45s;
  }
  /* while the envelope is sealed, the invisible choices must swallow NOTHING —
     visibility (not just opacity) also stops clicks landing through the paper */
  .sheet-actions[aria-hidden="true"]{visibility:hidden;}
  .sheet-actions[aria-hidden="true"] .sheet-btn{pointer-events:none;}
  .sheet-btn{
    pointer-events:auto;cursor:pointer;text-decoration:none;text-align:center;
    background:linear-gradient(180deg,#FFFDF6,#F8F0DA);
    color:#8E2233;border:1.2px solid rgba(184,134,46,.55);
    font-family:var(--font-display);font-size:14.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;line-height:1.35;
    padding:17px 22px;border-radius:14px;
    box-shadow:0 4px 14px rgba(80,54,10,.16), inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
  }
  .sheet-btn:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .sheet-btn:active{transform:translateY(0);}
  .sheet-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .sheet-btn:hover{box-shadow:0 7px 18px rgba(80,54,10,.24);}
  .sheet-btn.grown{color:#8E2233;}
  .sheet-btn.kids{color:#2E4396;}

  .loading{
    position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
    background:var(--sky);color:rgba(29,43,80,.75);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    font-family:var(--font-display);font-weight:700;
    transition:opacity .6s ease;
  }
  .loading.gone{opacity:0;pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    .open-btn,.sheet-actions{transition:none;}
    .open-cta{animation:none;}
    .stage.idle #scene-video,.stage.idle .stage__ph{animation:none;}
  }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <img class="stage__ph" id="ph" src="assets/envelope-p.webp" alt="" />
    <video id="scene-video" muted playsinline preload="auto"
           poster="assets/envelope-poster-m.webp"></video>
    <button class="tap-layer" id="taplayer" tabindex="-1" aria-hidden="true"></button>
  </div>

  <div class="ui">
    <button class="open-btn open-cta" id="toggle" aria-label="Open the envelope">Tap to Open</button>
  </div>

  <!-- choices live on the letter; positioned by JS, revealed when the envelope opens -->
  <div class="sheet-actions" id="sheet" aria-hidden="true">
    <a class="sheet-btn grown" href="adult/">Glad You Were Born Today</a>
    <a class="sheet-btn kids" href="story.html">Glad You Were Born Today (Kids)</a>
  </div>

  <canvas id="confetti"></canvas>
  <div class="loading" id="loading">Folding the paper…</div>

  <script src="music.js?v=7" data-src="assets/audio/envelope.wav?v=1"></script>
  <script>
  (function () {
    "use strict";
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const portrait = window.matchMedia("(orientation: portrait)").matches;

    // ---- Config (anchor is 0: the video IS the open animation, frame 0 = sealed) ----
    const CFG = portrait ? {
      src: "assets/vid/envelope-m.mp4", poster: "assets/envelope-poster-m.webp",
      anchor: 0, frameW: 1080, frameH: 1920,
      letter: { x: 0.50, y: 0.305, h: 0.22 }   // blank zone below the crest, party-cloudscape clip
    } : {
      src: "assets/vid/envelope.mp4", poster: "assets/envelope-poster.webp",
      anchor: 0, frameW: 1920, frameH: 1080,
      letter: { x: 0.50, y: 0.44, h: 0.50 }
    };

    const v = document.getElementById("scene-video");
    const ph = document.getElementById("ph");
    const tap = document.getElementById("taplayer");
    const btn = document.getElementById("toggle");
    const sheetEl = document.getElementById("sheet");
    const loading = document.getElementById("loading");
    const stage = document.querySelector(".stage");

    v.poster = CFG.poster; v.src = CFG.src;

    // ---- State machine ----
    let state = "loading";
    let fallbackMode = false;   // true once the static-poster bail path takes over
    function setState(s) { state = s; onState(); }

    const EPS = 1 / 30;      // one frame at 30fps
    const END = () => (v.duration || 6) - EPS;

    // rAF watcher pauses playback at a target time
    let watchRAF = 0;
    function playUntil(t, done) {
      cancelAnimationFrame(watchRAF);
      const step = () => {
        if (v.paused) { v.currentTime = t; done(); return; }
        if (v.currentTime >= t - EPS) { v.pause(); v.currentTime = t; done(); return; }
        watchRAF = requestAnimationFrame(step);
      };
      v.play().catch(() => { cancelAnimationFrame(watchRAF); v.currentTime = CFG.anchor; setState("sealed"); });  // play only ever follows a user gesture; catch resets safely
      watchRAF = requestAnimationFrame(step);
    }

    function onState() {
      const sealed = state === "sealed", open = state === "open";
      stage.classList.toggle("idle", sealed);
      btn.hidden = !(sealed || open);
      btn.textContent = open ? "Seal it back" : "Tap to Open";
      btn.setAttribute("aria-label", open ? "Close the envelope" : "Open the envelope");
      sheetEl.setAttribute("aria-hidden", open ? "false" : "true");
      if (!open) { sheetEl.style.opacity = "0"; sheetEl.style.pointerEvents = "none"; }
      if (open) revealSheet();                     // defined in Task 5
    }

    // ---- Boot: no intro — the page waits on the sealed envelope (frame 0) ----
    v.addEventListener("loadeddata", () => {
      if (state !== "loading") return;
      loading.classList.add("gone"); ph.classList.add("gone");
      setState("sealed");
    }, { once: true });
    v.load();

    // Video never arrives: static-poster fallback — the site must never dead-end
    const bail = setTimeout(() => {
      if (state !== "loading") return;
      fallbackMode = true;
      v.remove();
      ph.src = CFG.poster; ph.classList.remove("gone"); ph.style.filter = "none"; ph.style.transform = "none";
      loading.classList.add("gone");
      setState("sealed");
      // in fallback, "open" = reveal buttons over the poster, centered
      toggle = function () {
        if (state === "sealed") { if (window.swMusic) window.swMusic.on(); setState("open"); sheetEl.style.left = "50%"; sheetEl.style.top = "58%"; sheetEl.style.opacity = "1"; sheetEl.style.pointerEvents = "auto"; fireConfetti(); }
        else if (state === "open") { setState("sealed"); }
      };
      // Task 5's tap/btn listeners already delegate through this reassigned `toggle`
      // via arrow-wrapper closures — no extra listeners are added here. Note that
      // setState("open") still runs onState() → revealSheet(), whose scale clamp and
      // focus-move apply in fallback mode too; only left/top are overridden below it.
    }, 8000);
    v.addEventListener("loadeddata", () => clearTimeout(bail), { once: true });

    // ---- Buttons on the letter: cover-crop mapping -----------------------
    function revealSheet() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.max(vw / CFG.frameW, vh / CFG.frameH);
      const dw = CFG.frameW * scale, dh = CFG.frameH * scale;
      const ox = (dw - vw) / 2, oy = (dh - vh) / 2;
      let left = CFG.letter.x * dw - ox;
      let top  = CFG.letter.y * dh - oy;
      // clamp so the buttons can never land offscreen (e.g. after rotating the
      // phone while open)
      left = Math.min(vw * 0.88, Math.max(vw * 0.12, left));
      top  = Math.min(vh * 0.88, Math.max(vh * 0.12, top));
      sheetEl.style.left = left + "px";
      sheetEl.style.top  = top + "px";
      // floor raised from 0.62 to 0.8: at 0.62 the two-line .sheet-btn (padding
      // 13px*2 + border 2px + ~2 lines of 13px/9.5px text) renders under the
      // 44px min tap-target size; 0.8 keeps it comfortably above 44px. See task-6-report.md.
      const s = Math.min(1.18, Math.max(0.92, (CFG.letter.h * dh) / 440));
      sheetEl.style.setProperty("--s", s.toFixed(3));
      sheetEl.style.opacity = "1";
      sheetEl.style.pointerEvents = "auto";      // ONLY here does the overlay become tappable
      // move focus to the first choice, but only when the reveal was triggered by the
      // opener (tap layer or the sr-only button) — not on a resize reposition while
      // already open, which would otherwise steal focus from wherever the user is.
      if (document.activeElement === btn || document.activeElement === tap) {
        sheetEl.querySelector("a").focus({ preventScroll: true });
      }
    }

    // ---- Open / close (let: the Task 6 static-poster fallback reassigns it) ----
    let toggle = function () {
      if (state === "sealed") {
        if (window.swMusic) window.swMusic.on();   // the tap is a user gesture: music may start
        setState("opening");
        if (reduced) { v.currentTime = END(); setState("open"); fireConfetti(); return; }
        playUntil(END(), () => { setState("open"); fireConfetti(); });
      } else if (state === "open") {
        setState("closing");
        if (reduced) { v.currentTime = CFG.anchor; setState("sealed"); return; }
        let last = performance.now();
        const back = (now) => {
          const dt = (now - last) / 1000; last = now;
          v.currentTime = Math.max(CFG.anchor, v.currentTime - dt * 1.6);
          if (v.currentTime <= CFG.anchor + EPS) { v.currentTime = CFG.anchor; setState("sealed"); return; }
          requestAnimationFrame(back);
        };
        requestAnimationFrame(back);
      }
    };

    tap.addEventListener("click", () => toggle());
    btn.addEventListener("click", () => toggle());
    if (/[?&]open/.test(location.search))        // QA shortcut, same as old page
      v.addEventListener("loadeddata", () => setTimeout(() => { v.currentTime = CFG.anchor; setState("sealed"); toggle(); }, 300), { once: true });

    // ==== CONFETTI (verbatim from Assets/envelope/confetti-snippet.js) ====
    const isMobile = window.matchMedia("(max-width: 760px), (pointer: coarse)").matches;

    const confettiCanvas = document.getElementById("confetti");
    const cctx = confettiCanvas.getContext("2d");
    let cdpr = Math.min(window.devicePixelRatio, 2);
    function sizeConfetti() {
      cdpr = Math.min(window.devicePixelRatio, 2);
      confettiCanvas.width = Math.floor(window.innerWidth * cdpr);
      confettiCanvas.height = Math.floor(window.innerHeight * cdpr);
      confettiCanvas.style.width = window.innerWidth + "px";
      confettiCanvas.style.height = window.innerHeight + "px";
    }
    sizeConfetti();

    const CONFETTI_COLORS = ["#f973ab", "#ff9ec7", "#e9b949", "#f4d06f", "#8fdcc0", "#c9a7f5", "#fff6fb", "#a23a2e"];
    let confetti = [];
    let confettiRAF = 0, confettiLast = 0;

    function fireConfetti() {
      const cw = window.innerWidth, chh = window.innerHeight;
      const ox = cw * 0.5, oy = chh * 0.5;
      const n = reduced ? 36 : (isMobile ? 90 : 170);
      const vscale = reduced ? 0.5 : 1;
      for (let i = 0; i < n; i++) {
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
        const sp = (reduced ? 180 : 520) + Math.random() * (reduced ? 150 : 760);
        confetti.push({
          x: ox + (Math.random() - 0.5) * 60,
          y: oy + (Math.random() - 0.5) * 30,
          vx: Math.cos(ang) * sp * vscale,
          vy: Math.sin(ang) * sp * vscale,
          w: 6 + Math.random() * 6,
          h: 9 + Math.random() * 9,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 12,
          tilt: Math.random() * Math.PI * 2,
          vt: 4 + Math.random() * 6,
          sway: 1 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2,
          color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
          life: 0,
          max: (reduced ? 1.6 : 2.6) + Math.random() * 1.2,
          round: Math.random() < 0.18,
        });
      }
      if (!confettiRAF) { confettiLast = performance.now(); confettiRAF = requestAnimationFrame(confettiStep); }
    }

    function confettiStep(now) {
      let dt = (now - confettiLast) / 1000; confettiLast = now;
      if (dt > 0.05) dt = 0.05;
      const chh = window.innerHeight;
      const grav = reduced ? 600 : 1500;
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      cctx.save();
      cctx.scale(cdpr, cdpr);
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.life += dt;
        c.vy += grav * dt;
        c.vx *= 0.99;
        c.x += c.vx * dt + Math.sin(c.life * c.sway + c.phase) * 0.6;
        c.y += c.vy * dt;
        c.rot += c.vr * dt;
        c.tilt += c.vt * dt;
        if (c.life > c.max || c.y > chh + 60) { confetti.splice(i, 1); continue; }
        const fade = c.life > c.max - 0.8 ? Math.max(0, (c.max - c.life) / 0.8) : 1;
        cctx.save();
        cctx.translate(c.x, c.y);
        cctx.rotate(c.rot);
        cctx.scale(1, Math.cos(c.tilt));
        cctx.globalAlpha = fade;
        cctx.fillStyle = c.color;
        if (c.round) { cctx.beginPath(); cctx.arc(0, 0, c.w * 0.5, 0, Math.PI * 2); cctx.fill(); }
        else { cctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); }
        cctx.restore();
      }
      cctx.restore();
      if (confetti.length) { confettiRAF = requestAnimationFrame(confettiStep); }
      else { cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); confettiRAF = 0; }
    }
    // ======================================================================

    window.addEventListener("resize", () => { sizeConfetti(); if (state === "open" && !fallbackMode) revealSheet(); });
  })();
  </script>
</body>
</html>
