<!doctype html>
<html><head><meta charset="utf-8"><title>ui probe</title>
<style>html,body{margin:0}iframe{width:390px;height:844px;border:0}</style></head>
<body>
<script>
  const Q = new URLSearchParams(location.search);
  const f = document.createElement("iframe");
  f.src = Q.get("page") || "/story.html";
  document.body.appendChild(f);
  // ?envelope=kids|adult: drive the front door first
  const ENV = Q.get("envelope");
  if (ENV) {
    let opened = false, launched = false;
    const iv = setInterval(() => {
      let d; try { d = f.contentDocument; } catch (e) { return; }
      if (!d) return;
      if (!opened) {
        const btn = d.getElementById("toggle");
        if (btn && !btn.hidden) { opened = true; btn.click(); btn.click(); return; }
        const tapl = d.getElementById("taplayer");
        if (tapl) tapl.click();
        return;
      }
      if (!launched) {
        const sheet = d.getElementById("sheet");
        if (sheet && sheet.getAttribute("aria-hidden") === "false") {
          launched = true;
          d.querySelector(ENV === "adult" ? ".sheet-btn.grown" : ".sheet-btn.kids").click();
          clearInterval(iv);
        }
      }
    }, 700);
  }
  const errs = [];
  setTimeout(() => {
    let d, w;
    try { d = f.contentDocument; w = f.contentWindow; } catch (e) { return; }
    const r = sel => {
      const el = d.querySelector(sel);
      if (!el) return null;
      const b = el.getBoundingClientRect();
      const cs = w.getComputedStyle(el);
      return { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height),
               display: cs.display, vis: cs.visibility };
    };
    const rec = {
      innerW: w.innerWidth, innerH: w.innerHeight,
      burger: r(".gnav__burger"), links: r(".gnav__links"), bar: r(".gnav"),
      panel: r(".gnav__panel"),
      tw: r(".tw"), skip: r(".tw-skip"), dots: r(".tw-dots"), video: r(".tw video"),
    };
    fetch("/report?s=uiprobe", { method: "POST", body: JSON.stringify(rec) }).catch(() => {});
  }, parseInt(Q.get('wait') || '6000', 10));
</script>
</body></html>
